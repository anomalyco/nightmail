name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  # The merge queue on dev tests each pull request merged onto the latest dev and the entries ahead of it, and merges
  # only if all six required checks pass there (docs/ci.md).
  merge_group:
    types: [checks_requested]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # The queue already tested the exact commit it pushed. Direct pushes still run every suite.
    if: github.event_name != 'push' || github.actor != 'github-merge-queue[bot]'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      base: ${{ steps.scope.outputs.base }}
      api: ${{ steps.scope.outputs.api }}
      sdk: ${{ steps.scope.outputs.sdk }}
      dashboard: ${{ steps.scope.outputs.dashboard }}
      build: ${{ steps.scope.outputs.build }}
      acceptance: ${{ steps.scope.outputs.acceptance }}
      preview: ${{ steps.scope.outputs.preview }}
      cls: ${{ steps.scope.outputs.cls }}
      gateway: ${{ steps.scope.outputs.gateway }}
      support: ${{ steps.scope.outputs.support }}
      audit: ${{ steps.scope.outputs.audit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          persist-credentials: false
      - id: scope
        env:
          EVENT_BASE: ${{ github.event.merge_group.base_sha || github.event.before }}
          PR_HEAD_REPO_ID: ${{ github.event.pull_request.head.repo.id }}
          PR_FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: bash .github/scripts/ci-scope.sh

  build-work:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.16.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - &bun-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-1.3.14-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('*/bun.lock', '.github/s3-fixture/bun.lock') }}
      - run: for pkg in api sdk app; do (cd "$pkg" && bun install --frozen-lockfile); done
      # docs:check compiles the regenerated SDK.
      - if: needs.changes.outputs.api == 'true' || needs.changes.outputs.sdk == 'true' || needs.changes.outputs.acceptance == 'true'
        run: cd api && bun run check
      - name: Type-check the live SDK CLI probe
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.sdk == 'true'
        working-directory: api
        run: ./node_modules/.bin/tsc --ignoreConfig --noEmit --strict --skipLibCheck --target ES2022 --module NodeNext --lib ES2023,DOM,DOM.Iterable --types node scripts/e2e-upload-cli.ts
      # What broke dev after merge, checked before it: live E2E coverage, Cloudflare routing, migration order and
      # numbers (against dev and older open PRs), and phone card slots. docs/ci.md explains each failure.
      - name: Pre-merge invariants
        working-directory: api
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE: ${{ needs.changes.outputs.base }}
        run: node --import tsx scripts/check-premerge.ts --base "$BASE"
      - if: needs.changes.outputs.dashboard == 'true'
        run: cd app && bun run build
      - name: Prepare static assets for the Worker bundles
        if: needs.changes.outputs.api == 'true' && needs.changes.outputs.dashboard != 'true'
        run: cd app && ./node_modules/.bin/vite build
      - name: Build API and bundle both Workers without deploying
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.dashboard == 'true'
        working-directory: api
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          bun run build
          ./node_modules/.bin/wrangler deploy --dry-run --config wrangler.dev.jsonc --outdir "$RUNNER_TEMP/worker"
          ./node_modules/.bin/wrangler deploy --dry-run --config wrangler.prod.jsonc --outdir "$RUNNER_TEMP/worker-prod"
      - name: Regenerate and verify public docs, spec and SDK
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.sdk == 'true'
        run: |
          (cd api && bun run docs:check)
          git diff --exit-code -- api/openapi.json api/src/api-field-names.ts sdk/src
          test -z "$(git ls-files --others --exclude-standard -- sdk/src)"
      - name: Public API compatibility
        if: needs.changes.outputs.api == 'true' || needs.changes.outputs.sdk == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          ALLOWED: ${{ contains(github.event.pull_request.labels.*.name, 'api-breaking') }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node api/scripts/check-api-contract.mjs --self-test
          head=$GITHUB_SHA
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            # HEAD in the build checkout is GitHub's synthetic merge. Compare
            # the actual PR head against its merge-base, not the updated dev.
            # The base is the merge's first parent, today's dev: the event's base.sha stays where dev was when the pull
            # request opened, so a branch that has since merged dev would answer for dev's own changes.
            head=$PR_HEAD; BASE=$(git merge-base "$head" "$(git rev-parse HEAD^1)")
          elif [[ $GITHUB_EVENT_NAME == merge_group ]]; then
            # The first parent already includes every earlier entry. Only the PR merged in as the
            # second parent can waive a break introduced between that base and this queue commit.
            BASE=$(git rev-parse "$head^1"); ALLOWED=false
            if ! git diff --quiet "$BASE" "$head" -- api/openapi.json && [[ $QUEUE_REF =~ ^refs/heads/gh-readonly-queue/dev/pr-([0-9]+)-[0-9a-f]+$ ]]; then
              entry=$(gh api "repos/$GITHUB_REPOSITORY/pulls/${BASH_REMATCH[1]}")
              ALLOWED=$(jq -r --arg head "$(git rev-parse "$head^2")" '.base.ref == "dev" and .head.sha == $head and any(.labels[]; .name == "api-breaking")' <<< "$entry")
            fi
          else
            repo="repos/$GITHUB_REPOSITORY"
            prs=$(gh api --paginate --slurp "$repo/commits/$head/pulls?per_page=100")
            pr=$(jq -r --arg sha "$head" --arg repo "$GITHUB_REPOSITORY" '[.[][] | select(.merged_at and .base.repo.full_name == $repo and .base.ref == "dev" and .merge_commit_sha == $sha and any(.labels[]; .name == "api-breaking"))][0].number // empty' <<< "$prs")
            ALLOWED=false
            if [[ -n $pr ]] && git merge-base --is-ancestor "$BASE" "$head"; then
              commits=$(git rev-list "$BASE..$head"); ALLOWED=true
              for sha in $commits; do
                associated=$(gh api --paginate --slurp "$repo/commits/$sha/pulls?per_page=100")
                if ! jq -e --argjson pr "$pr" 'any(.[][]; .number == $pr)' <<< "$associated" >/dev/null; then ALLOWED=false; break; fi
              done
            fi
          fi
          git show "$BASE:api/openapi.json" > "$RUNNER_TEMP/base.json"
          git show "$head:api/openapi.json" > "$RUNNER_TEMP/head.json"
          args=(); if [[ $ALLOWED == true ]]; then args+=(--allow-breaking); fi
          node api/scripts/check-api-contract.mjs "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json" "${args[@]}"

  audit:
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      # M6: fail on any high or critical advisory in a locked dependency (runtime and tooling alike;
      # bun audit reads bun.lock). Fix by upgrading or a patch-level override in that package.json.
      # An ignore must name the advisory, why it cannot reach Nightmail, and what removes it.
      - name: Audit locked dependencies for high and critical advisories
        run: |
          set -euo pipefail
          # app: happy-dom is the Node entry of @tiptap/html; the dashboard bundle resolves its browser
          # entry (no happy-dom in app/dist). @tiptap/html's peer range ^20 excludes the fixed 21.0.4.
          for pkg in api app sdk; do
            args=(--audit-level=high)
            # app: picomatch (GHSA-fc5q-39xc-vjpf, ReDoS on crafted extglobs, no patched release) comes only through vite,
            # a devDependency, and matches our own build config's globs; it is not in app/dist. Drop it once picomatch
            # ships a fix.
            case $pkg in app) args+=(--ignore=GHSA-834v-8h66-3h79 --ignore=GHSA-c8p4-j97h-3vg8 --ignore=GHSA-fc5q-39xc-vjpf);; esac
            echo "::group::bun audit $pkg"; (cd "$pkg" && bun audit "${args[@]}"); echo '::endgroup::'
          done

  gateway-work:
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    timeout-minutes: 20
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            gateway/target
          key: cargo-${{ runner.os }}-${{ hashFiles('gateway/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy,rustfmt
      - name: Format, lint and unit tests
        run: cargo fmt --all --check && cargo clippy --all-targets --locked -- -D warnings && cargo test --locked

  acceptance-shard:
    # Matrix outputs are merged by key, not collected in an array. Key by job position so even
    # two runners reporting the same logical shard survive for the required check to diagnose.
    outputs: &shard-outputs
      slot0: ${{ steps.report.outputs.slot0 }}
      slot1: ${{ steps.report.outputs.slot1 }}
      slot2: ${{ steps.report.outputs.slot2 }}
      slot3: ${{ steps.report.outputs.slot3 }}
      slot4: ${{ steps.report.outputs.slot4 }}
      slot5: ${{ steps.report.outputs.slot5 }}
      slot6: ${{ steps.report.outputs.slot6 }}
      slot7: ${{ steps.report.outputs.slot7 }}
      slot8: ${{ steps.report.outputs.slot8 }}
    needs: changes
    if: needs.changes.outputs.acceptance == 'true'
    strategy:
      fail-fast: false
      matrix:
        fixture: [integration-contract, integration-rest, simulated-a-h, simulated-rest]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_PASSWORD: fixture-admin
        ports: ['5432:5432']
        options: &pg-options --tmpfs /var/lib/postgresql/data --health-cmd "pg_isready -h 127.0.0.1 -U postgres" --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.16.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - *bun-cache
      - run: for pkg in api .github/s3-fixture; do (cd "$pkg" && bun install --frozen-lockfile); done
      # Also the deadlock guard: Postgres detects lock cycles after 50 ms and logs lock waits, and the job fails on
      # any deadlock it counted, printing each cycle from the service's log (docs/ci.md).
      - name: Run all acceptance tests with isolated database and object storage
        run: bash ../.github/scripts/acceptance.sh
        working-directory: api
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          ACCEPTANCE_SHARD: ${{ matrix.fixture }}
          SHARD_REPORT: &shard-report ${{ runner.temp }}/shard-report.jsonl
      - &publish-shard
        id: report
        name: Report completed shard and full inventory
        env:
          SLOT: ${{ strategy.job-index }}
        run: |
          (( SLOT < 9 )) || { echo "::error::Unexpected matrix slot $SLOT"; exit 1; }
          rows=$(jq -ces 'select(length > 0)' "$RUNNER_TEMP/shard-report.jsonl")
          echo "slot$SLOT=$rows" | tee -a "$GITHUB_OUTPUT"

  # The real Worker before merge (docs/ci.md): dev's migrations then this change's, and this change's alone, must
  # apply and end with the same schema; then wrangler dev (workerd) serves wrangler.dev.jsonc's assets and routing on
  # the upgraded database with simulated SES, and every API route asked anonymously must be answered by the Worker.
  preview-work:
    needs: changes
    if: needs.changes.outputs.preview == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_PASSWORD: fixture-admin
        ports: ['5432:5432']
        options: *pg-options
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.16.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-1.3.14-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('api/bun.lock', 'app/bun.lock') }}
      - run: for pkg in api app; do (cd "$pkg" && bun install --frozen-lockfile); done
      - run: cd app && ./node_modules/.bin/vite build
      - name: Migrations (fresh and upgraded), the Worker under wrangler dev, and every route
        working-directory: api
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          BASE: ${{ needs.changes.outputs.base }}
        run: bash ../.github/scripts/preview.sh

  # Layout shift on every main dashboard page (light and dark, cold load and in-app navigation, throttled network,
  # slow out-of-order API responses) against the production build and a throwaway API with synthetic data.
  # Fails above CLS 0.001 on any page; the longest task per in-app navigation is reported. Locally: cd app && bun run cls.
  cls-shard:
    outputs: *shard-outputs
    needs: changes
    if: needs.changes.outputs.cls == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7, alone]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_PASSWORD: fixture-admin
        ports: ['5432:5432']
        options: *pg-options
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.16.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-1.3.14-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('api/bun.lock', 'app/bun.lock') }}
      - run: for pkg in api app; do (cd "$pkg" && bun install --frozen-lockfile); done
      # Builds the dashboard (build already type-checked it), then measures it with Chrome against Postgres.
      - uses: ./.github/actions/cls-build
      - name: Measure layout shift on every page
        working-directory: app
        env:
          SHARD_REPORT: *shard-report
          CLS_SHARD_INDEX: ${{ matrix.shard }}
          CLS_SHARD_COUNT: ${{ strategy.job-total }}
          CLS_PG_URL: postgresql://postgres:fixture-admin@127.0.0.1:5432/postgres
        run: node scripts/cls.mjs
      # Every painted docs page (the overview, the guides, every operation's reference) says word for word what the app's
      # says once it takes over, and keeps the reader's place (scripts/docs-sweep.mjs), in one shard.
      - name: Compare every painted docs page with the app's
        if: matrix.shard == 'alone'
        working-directory: app
        env:
          CLS_PG_URL: postgresql://postgres:fixture-admin@127.0.0.1:5432/postgres
        run: node scripts/docs-sweep.mjs
      # The television homepage, the dev stage's "/" (VITE_HOME=tv: deploy.yml), built beside the production one and
      # measured on its own (scripts/cls.mjs, CLS_HOME=tv), in one shard.
      - name: Measure layout shift on the television homepage
        if: matrix.shard == 'alone'
        working-directory: app
        env:
          VITE_HOME: tv
          SHARD_REPORT: *shard-report
          CLS_HOME: tv
          CLS_PG_URL: postgresql://postgres:fixture-admin@127.0.0.1:5432/postgres
        run: ./node_modules/.bin/vite build --outDir dist-tv && node scripts/cls.mjs
      - *publish-shard
      - name: Upload the shift sources
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cls-shift-sources-${{ matrix.shard }}
          path: app/.cls/
          include-hidden-files: true
          retention-days: 14

  # The support Worker (support/, the AI support agent's backend): types, the deployable bundle, and its tests, which
  # drive that bundle in Miniflare with a fake Nightmail and a scripted model (no network, no model calls).
  support-work:
    outputs: *shard-outputs
    needs: changes
    if: needs.changes.outputs.support == 'true'
    strategy:
      fail-fast: false
      matrix:
        fixture: [chat, queues]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.16.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-1.3.14-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('support/bun.lock') }}
      - run: bun install --frozen-lockfile
        working-directory: support
      - if: matrix.fixture == 'chat'
        run: bun run check
        working-directory: support
      - name: Bundle and test the support Worker
        working-directory: support
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: |
          queues='support Worker (intake work queue|conversation work queue|work ledger and sweep|replay and readiness) '
          pattern=$queues
          if [[ $FIXTURE == chat ]]; then pattern="^(?!.*$queues)"; fi
          ./node_modules/.bin/vitest list --json > "$RUNNER_TEMP/support-list.json"
          bun run test --testNamePattern "$pattern" --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/support-run.json"
          jq -cn --arg id "$FIXTURE" --slurpfile list "$RUNNER_TEMP/support-list.json" --slurpfile run "$RUNNER_TEMP/support-run.json" \
            '{id:$id,ran:$run[0].numPassedTests,total:($list[0] | length)}' > "$RUNNER_TEMP/shard-report.jsonl"
      - *publish-shard

  # Don't publish all six protected checks at once after the slowest shard. The dev queue saw
  # them go green together while branch protection still saw build in progress on the batch tip.
  required:
    name: &protected-name ${{ matrix.check }}
    needs: [changes, build-work, preview-work, gateway-work, support-work]
    if: &report-required always() && (github.event_name != 'push' || github.actor != 'github-merge-queue[bot]')
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        include:
          - { check: build, job: build-work, flag: build }
          - { check: preview, job: preview-work, flag: preview }
          - { check: gateway, job: gateway-work, flag: gateway }
          - { check: support, job: support-work, flag: support }
    steps: &verify-required
      - name: Verify suite result
        env:
          SCOPE: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs[matrix.flag] }}
          RESULT: ${{ needs[matrix.job].result }}
        run: |
          echo "Scope: $SCOPE; selected: $SELECTED; suite: $RESULT"
          [[ $SCOPE == success ]]
          [[ $SELECTED:$RESULT == true:success || $SELECTED:$RESULT == false:skipped ]]
      - name: Verify shard coverage
        if: always() && needs.changes.outputs[matrix.flag] == 'true' && contains(fromJSON('["acceptance","cls","support"]'), matrix.check)
        env:
          SUITE: ${{ matrix.check }}
          REPORTS: ${{ toJSON(needs[matrix.job].outputs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          suite = os.environ['SUITE']
          # Independent of the workflow matrix: deleting an entry must not shrink the expected set.
          inventories = {
              'acceptance': [['integration-contract', 'integration-rest', 'simulated-a-h', 'simulated-rest']],
              'support': [['chat', 'queues']],
              'cls': [[*map(str, range(8)), 'alone'], ['tv']],
          }[suite]
          expected = {shard for group in inventories for shard in group}
          seen, errors = {}, []
          for value in json.loads(os.environ['REPORTS']).values():
              for row in json.loads(value):
                  shard, ran, total = row['id'], row['ran'], row['total']
                  print(f'{suite} [{shard}]: {ran}/{total}')
                  if shard not in expected or shard in seen:
                      errors.append(f'{"duplicate" if shard in seen else "unexpected"} shard: {shard}')
                  if not (type(ran) is int and type(total) is int and 0 <= ran <= total and total > 0):
                      errors.append(f'invalid counts for {shard}: {ran}/{total}')
                  seen[shard] = row
          if missing := expected - seen.keys():
              errors.append('missing shard(s): ' + ', '.join(sorted(missing)))
          if not errors:
              grand = 0
              for group in inventories:
                  totals = {seen[s]['total'] for s in group}
                  ran = sum(seen[s]['ran'] for s in group)
                  if len(totals) != 1:
                      errors.append(f'inventory sizes disagree for {group}: {sorted(totals)}')
                  elif ran != (total := totals.pop()):
                      errors.append(f'{group}: ran {ran}/{total}; {abs(total - ran)} {"missing" if ran < total else "extra"}')
                  grand += ran
          if errors:
              sys.exit(f'{suite}: ' + '; '.join(errors))
          print(f'::notice title=Shard coverage::{suite}: {grand}/{grand} {"measurements" if suite == "cls" else "cases"}')
          PYTHON

  required-cls:
    name: *protected-name
    needs: [changes, cls-shard]
    if: *report-required
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      matrix:
        include:
          - { check: cls, job: cls-shard, flag: cls }
    steps: *verify-required

  # The acceptance shards still run in parallel with all the work above. Only publication
  # of their verdict waits for the other five protected checks to finish.
  required-acceptance:
    name: *protected-name
    needs: [changes, acceptance-shard, required, required-cls]
    if: *report-required
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      matrix:
        include:
          - { check: acceptance, job: acceptance-shard, flag: acceptance }
    steps: *verify-required

  # The failed checks live on a synthetic commit, not on the PR that entered the queue.
  report-queue-failure:
    needs: [audit, required, required-cls, required-acceptance]
    if: failure() && github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/dev'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Comment only on a confirmed queue ejection
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail
          [[ $QUEUE_REF =~ ^refs/heads/gh-readonly-queue/dev/pr-([0-9]+)-[0-9a-f]+$ ]]
          pr=${BASH_REMATCH[1]}
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          failed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            --jq '[.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | .name]
                  | select(any(.[]; IN("build", "acceptance", "cls", "preview", "gateway", "support"))) | join(", ")')
          [[ -n $failed ]] || exit 0

          # A failed follower can be rebuilt without being ejected. Match its PR, reason and exact group SHA.
          query='query($owner: String!, $repo: String!, $pr: Int!) {
            repository(owner: $owner, name: $repo) { pullRequest(number: $pr) {
              timelineItems(last: 100, itemTypes: [REMOVED_FROM_MERGE_QUEUE_EVENT]) {
                nodes { ... on RemovedFromMergeQueueEvent { reason beforeCommit { oid } } }
              }
            } }
          }'
          for poll in {0..12}; do
            if (( poll > 0 )); then sleep 15; fi
            if removed=$(gh api graphql -f query="$query" -f owner="$GITHUB_REPOSITORY_OWNER" \
                -f repo="${GITHUB_REPOSITORY#*/}" -F pr="$pr" \
                --jq '.data.repository.pullRequest.timelineItems.nodes[] | select(.reason == "failed_checks") | .beforeCommit.oid') \
                && grep -Fxq "$GITHUB_SHA" <<< "$removed"; then
              gh pr comment "$pr" -R "$GITHUB_REPOSITORY" --body "Removed from the merge queue after CI failed: $failed. [Queue run]($run)"
              exit 0
            fi
          done
