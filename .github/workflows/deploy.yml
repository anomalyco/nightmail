name: Deploy
run-name: Deploy ${{ github.ref_name }} ${{ inputs.auto_run && inputs.ref || github.sha }}

# One workflow per stage. The branch picks the stage (dev or production), and
# the stage picks the environment, the AWS role, the Pulumi stack and the
# Worker config. Infra is applied first, then the Worker migrates and deploys,
# then health and the live dev E2E run — in one run, so a Pulumi Worker-secret
# write can never race the E2E as it could when pulumi.yml was separate.
#
# A dev deploy starts on the push itself, alongside that push's CI. Production
# deploys only a commit with passing CI (queue tree or dev push) and a passing
# live dev E2E for that SHA (dev-proof.sh), and needs no
# reviewer: the proof, the production branch's ruleset and its fast-forward
# history gate it (docs/ci.md).
on:
  push:
    branches: [dev, production]
  workflow_dispatch:
    inputs:
      auto_run:
        description: 'Automation only: dev push run that proved ref'
        required: false
        type: string
      ref:
        description: 'Production only: branch, tag or SHA on production to deploy instead of its tip'
        required: false
        default: production
        type: string
      init:
        description: Create the Pulumi stack with its KMS secrets provider if it does not exist
        type: boolean
        default: false
      preview:
        description: Preview the Pulumi stack only; do not apply it or deploy the Worker
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize
    runs-on: ubuntu-24.04
    # Production waits here for a dev push CI that is still running (up to 25 minutes).
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      deployments: read
      pull-requests: read
    outputs:
      stage: ${{ steps.stage.outputs.stage }}
      sha: ${{ steps.pin.outputs.sha }}
      attempt: ${{ steps.pin.outputs.attempt }}
      pulumi: ${{ steps.paths.outputs.pulumi }}
      tenant_status: ${{ steps.paths.outputs.tenant_status }}
      dev_cutover: ${{ steps.dev_scope.outputs.changed }}
    steps:
      - name: Authenticate the automatic release request
        if: inputs.auto_run != ''
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.auto_run }}
          SHA: ${{ inputs.ref }}
          PUSHER: ${{ github.actor }}
          ACTOR: ${{ github.triggering_actor }}
          AUTO_SHIP: ${{ vars.AUTO_SHIP }}
        run: |
          set -euo pipefail
          [[ $GITHUB_EVENT_NAME == workflow_dispatch && $GITHUB_REF == refs/heads/production && ${AUTO_SHIP,,} != off ]]
          [[ $PUSHER == 'github-actions[bot]' && $ACTOR =~ ^(github-actions\[bot\]|thdxr|R44VC0RP)$ ]]
          [[ $RUN =~ ^[1-9][0-9]*$ && $SHA =~ ^[0-9a-f]{40}$ ]]
          [[ ${{ inputs.init || false }} == false && ${{ inputs.preview || false }} == false ]]
          repo="repos/$GITHUB_REPOSITORY"
          gh api "$repo/actions/runs/$RUN" | jq -e --arg sha "$SHA" --arg repo "$GITHUB_REPOSITORY" '
            .path == ".github/workflows/deploy.yml" and .event == "push" and .head_branch == "dev" and
            .head_sha == $sha and .head_repository.full_name == $repo' >/dev/null
          # Authorize checked the original dev pusher (including the queue enqueuer) and the live E2E ran for this SHA.
          gh api "$repo/actions/runs/$RUN/jobs?filter=latest&per_page=100" | jq -e --arg job "Deploy dev $SHA" '
            any(.jobs[]; .name == "Authorize" and .conclusion == "success") and
            any(.jobs[]; .name == $job and .conclusion == "success" and any(.steps[]; .name == "Live dev E2E" and .conclusion == "success"))' >/dev/null
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      # github.actor pushed or dispatched; a rerun keeps it and makes the
      # rerunner github.triggering_actor, so both are checked. The merge queue
      # pushes dev as github-merge-queue[bot] on behalf of whoever added the
      # pull request to it (its merged_by; only users allowed to push dev can),
      # so for that pusher the pull request merged at exactly this commit must
      # have been merged by an authorized actor.
      - name: Require an authorized actor
        if: steps.source.outputs.sha == ''
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.triggering_actor }}
          PUSHER: ${{ github.actor }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          allowed='^(thdxr|R44VC0RP)$'
          enqueued_by() {
            [[ $SHA =~ ^[0-9a-f]{40}$ ]] || return 0
            # GitHub links the queue's merge commit to its pull request a few
            # seconds after the push that starts this job (#151's own deploy
            # found none 4 s in), so retry an empty lookup for up to 2 minutes.
            local pr='' try
            for ((try = 1; try <= 12; try++)); do
              pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" | jq -r --arg sha "$SHA" --arg repo "$GITHUB_REPOSITORY" '[.[] | select(.merged_at and .base.ref == "dev" and .base.repo.full_name == $repo and .merge_commit_sha == $sha) | .number][0] // empty')
              [[ $pr =~ ^[0-9]+$ ]] && break
              if ((try < 12)); then echo "No merged pull request for $SHA yet; retrying in 10 s." >&2; sleep 10; fi
            done
            [[ $pr =~ ^[0-9]+$ ]] || return 0
            gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.merged_by.login // empty'
          }
          require() {
            [[ $2 =~ $allowed ]] && return 0
            if [[ $EVENT == push && $GITHUB_REF == refs/heads/dev && $2 == 'github-merge-queue[bot]' ]]; then
              by=$(enqueued_by)
              if [[ $by =~ $allowed ]]; then echo "The merge queue pushed $SHA for $by."; return 0; fi
              echo "::error::Only thdxr and R44VC0RP may deploy (the merge queue pushed $SHA for ${by:-an unknown pull request})."
              exit 1
            fi
            echo "::error::Only thdxr and R44VC0RP may deploy ($1: $2)."
            exit 1
          }
          require actor "$ACTOR"
          if [[ $PUSHER != "$ACTOR" ]]; then require 'original actor' "$PUSHER"; fi

      - id: stage
        name: Pick the stage from the branch
        run: |
          case "$GITHUB_REF" in
            refs/heads/dev|refs/heads/production) echo "stage=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Invalid deployment branch $GITHUB_REF"; exit 1 ;;
          esac

      # Check the triggering commit, not a production rollback's explicitly
      # authorized ancestor. Reuse this live check in each privileged job
      # (including on failed-job reruns).
      - &stage-tip
        name: Require the triggering commit to still be the stage branch tip
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          AUTO_SHA: ${{ inputs.auto_run && inputs.ref || '' }}
          AUTO_SHIP: ${{ vars.AUTO_SHIP }}
        run: |
          if [[ $GITHUB_REF_NAME == production && $GITHUB_JOB != authorize && ${AUTHORIZED_ATTEMPT:-} != "$GITHUB_RUN_ATTEMPT" ]]; then
            echo '::error::Re-run all jobs to recheck the deployed SHA under the stage lock.'; exit 1
          fi
          tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)
          [[ $tip =~ ^[0-9a-f]{40}$ ]]
          if [[ $tip != "$EXPECTED_SHA" ]]; then
            echo "::error::Deployment stopped: $GITHUB_REF_NAME advanced from $EXPECTED_SHA to $tip."
            exit 1
          fi
          if [[ -n $AUTO_SHA ]]; then
            [[ ${AUTO_SHIP,,} != off && $AUTO_SHA == "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/dev" --jq .object.sha)" ]] || { echo '::error::Auto-ship stopped: disabled or dev advanced.'; exit 1; }
          fi

      - id: pin
        name: Pin the commit to deploy
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          STAGE: ${{ steps.stage.outputs.stage }}
          INPUT_REF: ${{ inputs.ref }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          if [[ $EVENT == workflow_dispatch && $STAGE == production && -n $INPUT_REF && $INPUT_REF != production ]]; then
            ref=$(jq -rn --arg ref "$INPUT_REF" '$ref | @uri')
            sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$ref" --jq .sha)
          else
            sha=$EVENT_SHA
          fi
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Could not resolve a commit to deploy."; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      # Full history of every branch: the production ancestry check needs
      # origin/production, and the changed-path check needs the deployed
      # commit. The stage branch is what gets checked out; the commit to
      # deploy is pinned separately.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check the production commit
        if: steps.stage.outputs.stage == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pin.outputs.sha }}
          INPUT_REF: ${{ inputs.ref }}
          AUTO_SHA: ${{ steps.source.outputs.sha }}
        run: |
          [[ $SHA =~ ^[0-9a-f]{40}$ ]]
          # Rollbacks deploy an older production commit, so the ref must be an
          # ancestor of production rather than necessarily its tip.
          if ! git cat-file -e "$SHA^{commit}" 2>/dev/null; then
            echo "::error::$SHA is not a commit in this repository."; exit 1
          fi
          if ! git rev-parse --verify --quiet refs/remotes/origin/production >/dev/null; then
            echo "::error::origin/production is missing from the checkout."; exit 1
          fi
          if [[ -z ${AUTO_SHA:-} ]] && ! git merge-base --is-ancestor "$SHA" origin/production; then
            echo "::error::$SHA is not reachable from origin/production; production is fast-forward only, so deploy a commit it already contains."; exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/compare/$SHA...dev?per_page=1" | jq -e --arg sha "$SHA" '.merge_base_commit.sha == $sha' >/dev/null || { echo "::error::$SHA is not reachable from dev"; exit 1; }
          # Only an explicit production dispatch may roll back. Manual pushes share this same lock and forward check.
          if [[ -n ${AUTO_SHA:-} || $GITHUB_EVENT_NAME != workflow_dispatch || -z $INPUT_REF || $INPUT_REF == production ]]; then
            live=$(bash .github/scripts/deployed-sha.sh production)
            git merge-base --is-ancestor "$live" "$SHA" || { echo "::error::$SHA would roll back production from $live"; exit 1; }
            echo "DEPLOYED_BASE=$live" >> "$GITHUB_ENV"
          fi
          # The branch hosts the trusted workflow, not the live app ref. Never silently ship with obsolete gates.
          if [[ -n $AUTO_SHA ]] && ! git diff --quiet "$GITHUB_SHA" "$SHA" -- .github/workflows/deploy.yml .github/scripts/dev-proof.sh .github/scripts/deployed-sha.sh; then
            echo '::error::Release controls changed; install them on production with a normal proven manual push.'; exit 1
          fi

      # The dev deploy no longer waits for dev CI, so production checks both
      # halves of dev's proof itself, waiting for a CI that is still running.
      - name: Require a passing dev E2E and CI for this commit
        if: steps.stage.outputs.stage == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pin.outputs.sha }}
        run: bash .github/scripts/dev-proof.sh "$SHA"

      # Do not dispatch a production workflow for a push moving the dev stack. In particular,
      # never mark production deployed while silently skipping older, still-pending stack work.
      - id: dev_scope
        name: Check for a development infrastructure switch
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          BEFORE: ${{ github.event.before }}
        run: bash .github/scripts/dev-cutover-scope.sh "$BEFORE" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - id: paths
        name: Decide whether Pulumi has work
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ steps.pin.outputs.sha }}
          STAGE: ${{ steps.stage.outputs.stage }}
          AUTO_SHA: ${{ steps.source.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          DEV_CLOUD_CHECKPOINT: ${{ vars.DEV_CLOUD_CHECKPOINT }}
        run: |
          if [[ $STAGE == dev ]]; then
            checkpoint=$(jq -er '.checkpoint | strings | select(length > 0)' infra/dev-cloud-switch.json)
            if [[ $checkpoint != "$DEV_CLOUD_CHECKPOINT" ]]; then
              echo '::error::Dev cloud switch not armed: verify the writer fence, target DSNs, secrets, queue IDs and final data sync first.'
              exit 1
            fi
          fi
          if [[ $EVENT == workflow_dispatch && -z $AUTO_SHA ]]; then
            echo 'pulumi=true' >> "$GITHUB_OUTPUT"
            echo 'tenant_status=true' >> "$GITHUB_OUTPUT"
            echo 'Dispatch always runs Pulumi.' >> "$GITHUB_STEP_SUMMARY"
          else
            bash .github/scripts/pulumi-has-work.sh "$STAGE" "$SHA"
          fi

  pulumi:
    name: Pulumi ${{ needs.authorize.outputs.stage }}
    needs: authorize
    if: needs.authorize.outputs.pulumi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.ref_name }}
    permissions:
      contents: read
      id-token: write
    env:
      STAGE: ${{ needs.authorize.outputs.stage }}
      AUTHORIZED_ATTEMPT: ${{ needs.authorize.outputs.attempt }}
      # dev.bane.mx and everything behind it lives in anomaly-dev; production stays
      # in anomaly-production. Both the token issuer and every API call use this.
      CF_ACCOUNT_ID: ${{ needs.authorize.outputs.stage == 'dev' && 'd8e944f537ceef3f06a5bd3aec1d7a53' || '15d29c8639fd3733b1b5486a2acfd968' }}
      CF_R2_ENDPOINT: ${{ needs.authorize.outputs.stage == 'dev' && 'd8e944f537ceef3f06a5bd3aec1d7a53' || '15d29c8639fd3733b1b5486a2acfd968' }}.r2.cloudflarestorage.com
      STATE_BUCKET: ${{ needs.authorize.outputs.stage == 'dev' && 'nightmail-dev-pulumi' || 'bane-production-pulumi' }}
    steps:
      - &unfrozen
        name: Require production deploys to be unfrozen
        if: needs.authorize.outputs.stage == 'production'
        env:
          PROD_DEPLOY_ENABLED: ${{ vars.PROD_DEPLOY_ENABLED }}
        run: |
          # Environment variables are available inside an environment job, not
          # in its job-level if. A shell equality check is case-sensitive;
          # Actions' == isn't.
          if [ "$PROD_DEPLOY_ENABLED" != 'true' ]; then
            echo 'Production deploys are frozen. Set PROD_DEPLOY_ENABLED=true to release.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - *stage-tip

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false

      - name: Check for a Pulumi program
        id: guard
        run: |
          if [ -f infra/pulumi/Pulumi.yaml ] && [ -f "infra/pulumi/Pulumi.${STAGE}.yaml" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::infra/pulumi/Pulumi.yaml or infra/pulumi/Pulumi.${STAGE}.yaml is missing; skipping deploy"
          fi

      - name: Authenticate with AWS
        if: steps.guard.outputs.skip != 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/nightmail-${{ env.STAGE }}
          aws-region: us-east-1

      - name: Mint a short-lived Cloudflare token
        id: cloudflare
        if: steps.guard.outputs.skip != 'true'
        uses: ./.github/actions/cloudflare-token
        with:
          account-id: ${{ env.CF_ACCOUNT_ID }}

      - name: Configure R2 credentials and the Hyperdrive URL
        if: steps.guard.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.cloudflare.outputs.token }}
          R2_ACCESS_KEY_ID: ${{ steps.cloudflare.outputs.id }}
          R2_SECRET_ACCESS_KEY: ${{ steps.cloudflare.outputs.secret }}
        run: |
          set -euo pipefail
          set +x

          account="$CF_ACCOUNT_ID"
          mkdir -p "$HOME/.aws"
          {
            printf '\n[r2]\n'
            printf 'aws_access_key_id = %s\n' "$R2_ACCESS_KEY_ID"
            printf 'aws_secret_access_key = %s\n' "$R2_SECRET_ACCESS_KEY"
          } >> "$HOME/.aws/credentials"
          {
            printf '\n[profile r2]\n'
            printf 'region = auto\n'
          } >> "$HOME/.aws/config"

          # The Hyperdrive origin's password is never returned by Cloudflare, and
          # the program ignores origin.password on adoption and updates. Only the
          # runtime user, host, port and database matter, so the password here is
          # a placeholder.
          case "$STAGE" in
            dev) hyperdrive=1e39000095604539b994ea966a744ced ;;
            production) hyperdrive=556aba191add406eaa58a0e26eebb6b1 ;;
            *) echo "::error::unknown stage $STAGE"; exit 1 ;;
          esac
          origin=$(printf 'header = "Authorization: Bearer %s"\nurl = "https://api.cloudflare.com/client/v4/accounts/%s/hyperdrive/configs/%s"\n' \
            "$CLOUDFLARE_API_TOKEN" "$account" "$hyperdrive" |
            curl --config - --silent --show-error --fail-with-body --max-time 20 |
            jq -er '.result.origin | [.user, .host, (.port | tostring), .database] | @tsv')
          IFS=$'\t' read -r db_user db_host db_port db_name <<< "$origin"
          echo "BANE_HYPERDRIVE_DATABASE_URL=postgres://${db_user}:placeholder@${db_host}:${db_port}/${db_name}" >> "$GITHUB_ENV"

      - name: Install Pulumi
        if: steps.guard.outputs.skip != 'true'
        uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0
        with:
          pulumi-version: 3.274.1

      - name: Copy the dev checkpoint before selecting the new backend
        if: steps.guard.outputs.skip != 'true' && env.STAGE == 'dev' && !inputs.preview
        run: python3 .github/scripts/copy-pulumi-backend.py

      - name: Init stack
        if: steps.guard.outputs.skip != 'true' && github.event_name == 'workflow_dispatch' && inputs.init
        working-directory: infra/pulumi
        env:
          PULUMI_BACKEND_URL: s3://${{ env.STATE_BUCKET }}?endpoint=${{ env.CF_R2_ENDPOINT }}&region=auto&s3ForcePathStyle=true&awssdk=v2&profile=r2
        run: |
          set -euo pipefail
          if pulumi stack select "$STAGE" >/dev/null 2>&1; then
            echo "stack $STAGE already exists"
          else
            pulumi stack init "$STAGE" --secrets-provider "awskms://alias/pulumi/nightmail-${STAGE}?region=us-east-1"
          fi

      - name: Setup Bun
        if: steps.guard.outputs.skip != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        working-directory: infra/pulumi
        run: bun install --frozen-lockfile

      - name: Verify the operator-activated Ohio receiving set
        if: steps.guard.outputs.skip != 'true' && !inputs.preview
        run: |
          case "$STAGE" in production) account=009882681002;; dev) account=905840579680;; *) exit 1;; esac
          role=$(yq -er '.config."bane:deployRoleArn"' "infra/pulumi/Pulumi.$STAGE.yaml")
          [[ $role == "arn:aws:iam::$account:role/"* ]]
          aws configure set profile.receiving-bootstrap.role_arn "$role"
          aws configure set profile.receiving-bootstrap.credential_source Environment
          # --profile (rather than AWS_PROFILE) suppresses ambient credentials as final credentials.
          bash .github/scripts/receiving-rule-set.sh "$account" receiving-bootstrap

      - *stage-tip

      - name: Preview and check the gateway secret migration
        if: steps.guard.outputs.skip != 'true' && !inputs.preview
        working-directory: infra/pulumi
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.cloudflare.outputs.token }}
          PULUMI_BACKEND_URL: s3://${{ env.STATE_BUCKET }}?endpoint=${{ env.CF_R2_ENDPOINT }}&region=auto&s3ForcePathStyle=true&awssdk=v2&profile=r2
        run: |
          set -euo pipefail
          umask 077
          pulumi preview --stack "$STAGE" --save-plan "$RUNNER_TEMP/deploy.plan" --suppress-outputs --non-interactive
          python3 ../../.github/scripts/check-gateway-plan.py "$STAGE" "$RUNNER_TEMP/deploy.plan"

      - name: Deploy
        if: steps.guard.outputs.skip != 'true'
        uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.cloudflare.outputs.token }}
        with:
          command: ${{ inputs.preview && 'preview' || 'up' }}
          plan: ${{ !inputs.preview && format('{0}/deploy.plan', runner.temp) || '' }}
          stack-name: ${{ env.STAGE }}
          work-dir: infra/pulumi
          cloud-url: s3://${{ env.STATE_BUCKET }}?endpoint=${{ env.CF_R2_ENDPOINT }}&region=auto&s3ForcePathStyle=true&awssdk=v2&profile=r2
          pulumi-version: 3.274.1
          suppress-progress: true

      - *stage-tip

      - name: Verify operator-owned SES tenant status routing
        if: steps.guard.outputs.skip != 'true' && needs.authorize.outputs.tenant_status == 'true'
        run: bash .github/scripts/tenant-status-verify.sh

  deploy:
    name: Deploy ${{ needs.authorize.outputs.stage }} ${{ needs.authorize.outputs.sha }}
    needs: [authorize, pulumi]
    if: >-
      always() && needs.authorize.result == 'success' &&
      (needs.pulumi.result == 'success' || needs.pulumi.result == 'skipped') &&
      inputs.preview != true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment: ${{ github.ref_name }}
    outputs:
      e2e: ${{ steps.e2e.outcome }}
    env:
      STAGE: ${{ needs.authorize.outputs.stage }}
      AUTHORIZED_ATTEMPT: ${{ needs.authorize.outputs.attempt }}
      # Must match the stage's cloudflare account: the token is minted there and
      # verified against this id before Wrangler sees it.
      CF_ACCOUNT_ID: ${{ needs.authorize.outputs.stage == 'dev' && 'd8e944f537ceef3f06a5bd3aec1d7a53' || '15d29c8639fd3733b1b5486a2acfd968' }}
    steps:
      - *unfrozen
      - *stage-tip

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false

      # The dashboard's live support chat (app/src/components/SupportChat.tsx): on for every hosted workspace on dev;
      # in production only for Bane staff and free (billing-exempt) workspaces while it rolls out. "true" opens it to all.
      # VITE_PUBLIC_URL makes the link-preview image URLs in index.html absolute for the stage's own host.
      - uses: ./.github/actions/build-release
        env:
          VITE_SUPPORT_CHAT: ${{ needs.authorize.outputs.stage == 'dev' && 'true' || 'staff' }}
          VITE_PUBLIC_URL: ${{ needs.authorize.outputs.stage == 'dev' && 'https://dev.bane.mx' || 'https://bane.mx' }}

      # The environment picks the stage. No variable or secret name carries a
      # stage prefix: each stage reads the same keys from its own nightmail/<stage>/
      # folder below. Sign-in policy is committed in wrangler.<stage>.jsonc.
      - name: Configure the stage
        run: |
          case "$STAGE" in
            dev) public_url=https://dev.bane.mx; wrangler_config=wrangler.dev.jsonc ;;
            production) public_url=https://bane.mx; wrangler_config=wrangler.prod.jsonc ;;
            *) echo "::error::unknown stage $STAGE"; exit 1 ;;
          esac
          {
            echo "PUBLIC_URL=$public_url"
            echo "WRANGLER_CONFIG=$wrangler_config"
          } >> "$GITHUB_ENV"

      # The deploy secrets live in AWS Secrets Manager as nightmail/<stage>/* and are
      # read by the environment's own role (github/nightmail-<stage>). That role also
      # mints the short-lived Cloudflare token; no Cloudflare credential is stored.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/nightmail-${{ env.STAGE }}
          role-session-name: nightmail-${{ env.STAGE }}-secrets-${{ github.run_id }}
          aws-region: us-east-1

      - name: Fetch the stage secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            DATABASE_URL,nightmail/${{ env.STAGE }}/DATABASE_URL
            BANE_ROOT_SECRET,nightmail/${{ env.STAGE }}/BETTER_AUTH_SECRET
            ACCOUNT_CLIENT_PRIVATE_KEY,nightmail/${{ env.STAGE }}/ACCOUNT_CLIENT_PRIVATE_KEY
            TYPESAFE_API_KEY,nightmail/${{ env.STAGE }}/TYPESAFE_API_KEY
            STRIPE_SECRET_KEY,nightmail/${{ env.STAGE }}/STRIPE_SECRET_KEY
            STRIPE_WEBHOOK_SECRET,nightmail/${{ env.STAGE }}/STRIPE_WEBHOOK_SECRET
          parse-json-secrets: false

      # Only dev runs a live E2E, so only dev has an E2E key to read.
      - name: Fetch the dev E2E API key
        if: needs.authorize.outputs.stage == 'dev'
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            E2E_API_KEY,nightmail/dev/E2E_API_KEY
          parse-json-secrets: false

      - *stage-tip

      # Hyperdrive uses a runtime role, migrations use a different role. PlanetScale PG
      # usernames include the same branch routing suffix for both. Never log either URL.
      - name: Verify the dev migrator is paired with the cutover branch
        if: needs.authorize.outputs.stage == 'dev'
        working-directory: api
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const {branchRoutingHash} = JSON.parse(fs.readFileSync('../infra/dev-cloud-switch.json'));
          const u = new URL(process.env.DATABASE_URL);
          const [role,branch,...rest] = decodeURIComponent(u.username).split('.');
          if (!role || !branch || rest.length || createHash('sha256').update(branch).digest('hex') !== branchRoutingHash || u.searchParams.get('sslmode') !== 'verify-full') {
            throw Error('Dev migrator is not configured for the verified target branch');
          }
          JS

      - run: bun run migrate
        working-directory: api
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          PUBLIC_URL: ${{ env.PUBLIC_URL }}
          DEFAULT_SES_REGION: us-east-2
          MULTI_TENANT: 'true'

      # The live E2E's fixture workspace is exempt from the Hosted warm-up quota, so E2E volume can never hold its
      # campaigns (Nov 12: three red deploys on hosted_daily_quota). Dev only, idempotent, audited in
      # hosted_operator_audit; the script refuses any other stage or workspace (scripts/dev-e2e-fixture.ts).
      - name: Apply the dev E2E fixture policy
        if: needs.authorize.outputs.stage == 'dev'
        working-directory: api
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          PUBLIC_URL: ${{ env.PUBLIC_URL }}
          BANE_E2E_DOMAIN_ID: ${{ vars.E2E_DOMAIN_ID }}
        run: node --import tsx scripts/dev-e2e-fixture.ts

      - *stage-tip

      # Also syncs the mail gateway's key with the committed bane:mailGatewayEnabled in
      # infra/pulumi/Pulumi.<stage>.yaml: enabled reads nightmail/<stage>/MAILGW_API_TOKEN with
      # this job's role inside this step only (never $GITHUB_ENV), and disabled removes it.
      # Only mint when the Worker is ready to deploy. Superseded builds and failed migrations consume no issuer slot.
      - name: Mint a short-lived Cloudflare token
        id: cloudflare
        uses: ./.github/actions/cloudflare-token
        with:
          account-id: ${{ env.CF_ACCOUNT_ID }}

      - *stage-tip

      - name: Deploy the Worker
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.cloudflare.outputs.token }}
          DEPLOY_SHA: ${{ needs.authorize.outputs.sha }}
        run: bash ../.github/scripts/deploy-worker.sh "$WRANGLER_CONFIG"

      - name: Health check
        run: bash .github/scripts/health.sh "$PUBLIC_URL"

      # Best effort: stream the Worker's logs while the E2E runs, so a failure's report can quote the lines for its
      # request IDs. Needs Workers Tail Read on the dev token (anomalyco/secrets); without it the report says so.
      - name: Tail the dev Worker during the E2E
        if: needs.authorize.outputs.stage == 'dev'
        continue-on-error: true
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.cloudflare.outputs.token }}
        run: |
          nohup ./node_modules/.bin/wrangler tail --config "$WRANGLER_CONFIG" --format json > "$RUNNER_TEMP/worker-tail.jsonl" 2> "$RUNNER_TEMP/worker-tail.err" &
          echo "TAIL_PID=$!" >> "$GITHUB_ENV"
          sleep 5

      - name: Live dev E2E
        if: needs.authorize.outputs.stage == 'dev'
        id: e2e
        working-directory: api
        timeout-minutes: 5
        env:
          BANE_E2E_URL: ${{ env.PUBLIC_URL }}
          BANE_E2E_API_KEY: ${{ env.E2E_API_KEY }}
          BANE_E2E_DOMAIN: ${{ vars.E2E_DOMAIN }}
          BANE_E2E_DOMAIN_ID: ${{ vars.E2E_DOMAIN_ID }}
          BANE_E2E_REGION: us-east-2
          BANE_E2E_ALLOW_DESTRUCTIVE: '1'
        run: bun run e2e

      # Only the failed steps' own requests, and only Bane's structured fields: the report becomes a public issue.
      - name: Keep the Worker log lines of the failed requests
        if: ${{ !cancelled() && needs.authorize.outputs.stage == 'dev' && steps.e2e.outcome == 'failure' }}
        continue-on-error: true
        working-directory: api
        run: bash ../.github/scripts/e2e-worker-logs.sh e2e-report.json "$RUNNER_TEMP/worker-tail.jsonl" "$RUNNER_TEMP/worker-tail.err" > e2e-worker-logs.json

      - name: Stop the tail
        if: always() && env.TAIL_PID != ''
        run: kill "$TAIL_PID" 2>/dev/null || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() && needs.authorize.outputs.stage == 'dev' && (steps.e2e.outcome == 'success' || steps.e2e.outcome == 'failure') }}
        with:
          name: dev-e2e-${{ needs.authorize.outputs.sha }}-${{ github.run_attempt }}
          path: |
            api/e2e-report.json
            api/e2e-worker-logs.json
          if-no-files-found: warn

  promote:
    name: Request production deployment
    needs: [authorize, deploy]
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/dev' &&
      needs.authorize.outputs.dev_cutover == 'false' &&
      needs.deploy.result == 'success' && needs.deploy.outputs.e2e == 'success' && vars.AUTO_SHIP != 'off'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch the protected production workflow for this SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/dev" --jq .object.sha)
          if [[ $tip != "$GITHUB_SHA" ]]; then echo "Dev advanced to $tip; not shipping $GITHUB_SHA."; exit 0; fi
          gh workflow run deploy.yml -R "$GITHUB_REPOSITORY" --ref production -f ref="$GITHUB_SHA" -f auto_run="$GITHUB_RUN_ID"

  # A failed live dev E2E opens (or comments on) one issue with the failed steps, their request IDs and the Worker's
  # log lines for those requests. Production stays blocked exactly as before: it requires a passing dev E2E for its SHA.
  e2e-issue:
    name: Report the dev E2E failure
    needs: [authorize, deploy]
    if: always() && needs.authorize.outputs.stage == 'dev' && needs.deploy.outputs.e2e == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dev-e2e-${{ needs.authorize.outputs.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e
      - name: Open or update the dev E2E issue
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.authorize.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/e2e-issue.sh "$RUNNER_TEMP/e2e"

  # The support Worker (support/README.md): bane-support-dev beside bane-dev, bane-support beside bane-production. It runs
  # after Bane because its service binding needs Bane's SupportPlatform entrypoint. Off until the repository variable
  # SUPPORT_DEPLOY is 'true': its D1 database, support address and Worker secrets are set up once by hand, and its secrets
  # (CONSOLE_GATEWAY_KEY and the rest) are set with `wrangler secret put`, never read here.
  support:
    name: Deploy support ${{ needs.authorize.outputs.stage }} ${{ needs.authorize.outputs.sha }}
    needs: [authorize, deploy]
    if: always() && needs.deploy.result == 'success' && vars.SUPPORT_DEPLOY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    environment: ${{ github.ref_name }}
    env:
      STAGE: ${{ needs.authorize.outputs.stage }}
      AUTHORIZED_ATTEMPT: ${{ needs.authorize.outputs.attempt }}
      CF_ACCOUNT_ID: ${{ needs.authorize.outputs.stage == 'dev' && 'd8e944f537ceef3f06a5bd3aec1d7a53' || '15d29c8639fd3733b1b5486a2acfd968' }}
    steps:
      - *unfrozen
      - *stage-tip

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.16.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: support

      - name: Configure the stage
        run: |
          case "$STAGE" in
            dev) config=wrangler.dev.jsonc; database=nightmail-support-dev; url=https://support.dev.bane.mx ;;
            production) config=wrangler.prod.jsonc; database=bane-support; url=https://support.bane.mx ;;
            *) echo "::error::unknown stage $STAGE"; exit 1 ;;
          esac
          { echo "SUPPORT_CONFIG=$config"; echo "SUPPORT_DATABASE=$database"; echo "SUPPORT_URL=$url"; } >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/nightmail-${{ env.STAGE }}
          role-session-name: nightmail-${{ env.STAGE }}-support-${{ github.run_id }}
          aws-region: us-east-1

      - *stage-tip

      - name: Mint a short-lived Cloudflare token
        id: cloudflare
        uses: ./.github/actions/cloudflare-token
        with:
          account-id: ${{ env.CF_ACCOUNT_ID }}

      - *stage-tip

      # The token verifies at once, but D1's API can refuse a just-minted token for a few seconds (Authentication error
      # 10000; the Bane job above never sees it because its first call comes ~10 s after minting). Retry only that error:
      # migrations apply is idempotent and fails before running anything.
      - name: Migrate the support database
        working-directory: support
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.cloudflare.outputs.token }}
        run: |
          set -o pipefail
          out="$RUNNER_TEMP/support-migrate.log"
          for attempt in 1 2 3 4 5 6; do
            if ./node_modules/.bin/wrangler d1 migrations apply "$SUPPORT_DATABASE" --remote --config "$SUPPORT_CONFIG" 2>&1 | tee "$out"; then exit 0; fi
            grep -q 'code: 10000' "$out" || exit 1
            echo "::warning::D1 refused the new token (attempt $attempt); retrying in 10 s"
            sleep 10
          done
          echo "::error::D1 kept refusing the token"; exit 1

      - name: Deploy the support Worker
        working-directory: support
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.cloudflare.outputs.token }}
        run: |
          source ../.github/scripts/cloudflare-retry.sh
          cloudflare_retry ./node_modules/.bin/wrangler deploy --config "$SUPPORT_CONFIG" > /dev/null

      - name: Health check
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 10 "$SUPPORT_URL/health" | jq -e '.status == "ok"' > /dev/null; then exit 0; fi
            sleep 10
          done
          echo "::error::$SUPPORT_URL/health did not answer ok"; exit 1
